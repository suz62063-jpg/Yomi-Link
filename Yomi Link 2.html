<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Yomi Link · YOMI STUDIO</title>
<style>
/* =========================================================
   YOMI LINK ULTIMATE — 大厂级极简 Slate 设计系统 v2
   单文件 · 零依赖 · 流式 · 思维链 · 全量 Markdown
========================================================= */
:root {
    --bg-main: #212121;
    --bg-sidebar: #171717;
    --bg-surface: #2f2f2f;
    --bg-card: #2a2a2a;
    --bg-deep: #0d0d0d;
    --border-color: #424242;
    --border-soft: #383838;
    --text-main: #ececec;
    --text-sec: #b4b4b4;
    --text-dim: #8e8e8e;

    --accent-casual: #3b82f6;
    --accent-pro: #10a37f;
    --accent-se: #f59e0b;
    --danger: #ef4444;

    --code-key: #c792ea;
    --code-str: #a5d6a7;
    --code-num: #f78c6c;
    --code-com: #6a737d;
    --code-tag: #7fb4e8;
    --code-attr: #ffcb6b;
}

[data-theme="light"] {
    --bg-main: #ffffff;
    --bg-sidebar: #f9f9f9;
    --bg-surface: #f0f0f0;
    --bg-card: #f7f7f7;
    --bg-deep: #fafafa;
    --border-color: #e0e0e0;
    --border-soft: #ebebeb;
    --text-main: #0d0d0d;
    --text-sec: #5d5d5d;
    --text-dim: #8e8e8e;
    --code-key: #9c27b0;
    --code-str: #2e7d32;
    --code-num: #e65100;
    --code-com: #9e9e9e;
    --code-tag: #1565c0;
    --code-attr: #b26a00;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg-main); font-family: "SF Pro Text", "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; color: var(--text-main); }
::selection { background: rgba(16,163,127,0.3); }

#app { display: flex; width: 100vw; height: 100vh; height: 100dvh; position: relative; }

/* ==== Sidebar ==== */
.sidebar {
    width: 268px; background: var(--bg-sidebar); display: flex; flex-direction: column;
    transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1), width 0.3s ease; z-index: 90; flex-shrink: 0;
}
.sidebar-header { padding: 14px 12px 6px; display: flex; align-items: center; gap: 4px; }
.btn-new-chat {
    flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: transparent; border: none; color: var(--text-main); padding: 9px 10px; border-radius: 10px;
    font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; font-family: inherit;
}
.btn-new-chat:hover { background: var(--bg-surface); }
.icon-btn {
    width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; color: var(--text-main); cursor: pointer; transition: 0.18s; flex-shrink: 0;
}
.icon-btn:hover { background: var(--bg-surface); }
.icon-btn:active { transform: scale(0.92); }

.search-box { padding: 6px 12px 8px; }
.search-input {
    width: 100%; background: var(--bg-surface); border: 1px solid transparent; border-radius: 9px;
    padding: 8px 12px; color: var(--text-main); font-size: 13px; outline: none; transition: 0.2s; font-family: inherit;
}
.search-input:focus { border-color: var(--border-color); }
.search-input::placeholder { color: var(--text-dim); }

.chat-history { flex: 1; overflow-y: auto; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; -webkit-overflow-scrolling: touch; }
.chat-history::-webkit-scrollbar { width: 0; }
.history-section-label { font-size: 11px; color: var(--text-dim); font-weight: 600; padding: 12px 10px 4px; letter-spacing: 0.5px; }
.history-item {
    padding: 9px 10px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; gap: 4px;
    font-size: 13.5px; color: var(--text-main); transition: 0.15s; position: relative;
}
.history-item:hover, .history-item.active { background: var(--bg-surface); }
.history-item .title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.history-item .h-act {
    display: none; background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    padding: 3px; border-radius: 5px; flex-shrink: 0;
}
.history-item:hover .h-act { display: flex; }
.history-item .h-act:hover { color: var(--text-main); background: var(--border-color); }
.history-item .h-act.del:hover { color: var(--danger); }

.sidebar-footer { padding: 10px; border-top: 1px solid var(--border-soft); display: flex; align-items: center; gap: 4px; }
.user-profile-btn { flex: 1; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; cursor: pointer; transition: 0.2s; min-width: 0; }
.user-profile-btn:hover { background: var(--bg-surface); }
.user-avatar-small { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: var(--bg-surface); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--text-sec); flex-shrink: 0; overflow: hidden; }
.user-avatar-small img { width: 100%; height: 100%; object-fit: cover; }
.user-name-label { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ==== Main ==== */
.main-container { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-main); overflow: hidden; height: 100%; min-width: 0; }

.top-navbar {
    height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
    z-index: 80; background: transparent; margin-top: env(safe-area-inset-top); flex-shrink: 0;
}
.navbar-center-title {
    font-size: 15px; font-weight: 650; color: var(--text-main); display: flex; align-items: center; gap: 6px;
    user-select: none; cursor: pointer; padding: 7px 12px; border-radius: 9px; transition: 0.2s; position: relative;
}
.navbar-center-title:hover { background: var(--bg-surface); }

/* 模式下拉面板 */
.mode-menu {
    position: absolute; top: 52px; left: 50%; transform: translateX(-50%) translateY(-6px); width: 280px;
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 6px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.4); z-index: 150; opacity: 0; pointer-events: none; transition: 0.18s;
}
.mode-menu.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
.mode-option { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 9px; cursor: pointer; transition: 0.15s; }
.mode-option:hover { background: var(--bg-surface); }
.mode-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.mode-info { flex: 1; min-width: 0; }
.mode-name { font-size: 14px; font-weight: 650; }
.mode-desc { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
.mode-check { color: var(--accent-pro); opacity: 0; }
.mode-option.selected .mode-check { opacity: 1; }

/* 迎宾屏 (保留经典标语) */
.welcome-screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10; pointer-events: none; transition: opacity 0.4s ease; padding: 20px; text-align: center;
}
.welcome-screen.hidden { opacity: 0; }
.welcome-logo {
    width: 60px; height: 60px; border-radius: 18px; margin-bottom: 22px;
    background: linear-gradient(135deg, #10a37f 0%, #0b7a5e 100%);
    display: flex; align-items: center; justify-content: center; color: #fff;
    box-shadow: 0 8px 30px rgba(16,163,127,0.25);
    animation: logoFloat 5s ease-in-out infinite;
}
@keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.welcome-title {
    font-size: 28px; font-weight: 700; background: linear-gradient(135deg, var(--text-main), var(--text-dim));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 26px; letter-spacing: 1px;
}
.welcome-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; pointer-events: auto; }
.welcome-chip {
    background: transparent; border: 1px solid var(--border-color); color: var(--text-sec); padding: 8px 15px;
    border-radius: 99px; font-size: 13px; cursor: pointer; transition: 0.2s; font-family: inherit;
}
.welcome-chip:hover { border-color: var(--text-dim); color: var(--text-main); transform: translateY(-1px); }

.chat-wrapper {
    flex: 1; overflow-y: auto; padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 26px;
    max-width: 820px; margin: 0 auto; width: 100%; z-index: 20;
    -webkit-overflow-scrolling: touch;
}
.chat-wrapper::-webkit-scrollbar { width: 0; }

.message-row { display: flex; gap: 14px; max-width: 100%; animation: fadeIn 0.35s ease both; position: relative; }
@keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
.message-row.user { flex-direction: row-reverse; }

.msg-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--bg-surface); color: var(--text-sec); overflow: hidden;
}
.message-row.ai .msg-avatar {
    border-radius: 9px;
    background: linear-gradient(135deg, #10a37f 0%, #0b7a5e 100%);
    box-shadow: 0 3px 9px rgba(16, 163, 127, 0.22);
    color: white;
}

.msg-bubble { display: flex; flex-direction: column; gap: 6px; max-width: 88%; min-width: 0; }
.message-row.ai .msg-bubble { max-width: calc(100% - 44px); flex: 1; }
.message-row.user .msg-bubble { align-items: flex-end; }
.msg-content { font-size: 15.5px; line-height: 1.65; word-break: break-word; overflow-wrap: break-word; width: 100%; }
.message-row.user .msg-content { background: var(--bg-surface); padding: 10px 16px; border-radius: 20px; border-top-right-radius: 5px; white-space: pre-wrap; width: auto; }

/* ==== Markdown 渲染样式 ==== */
.msg-content h1, .msg-content h2, .msg-content h3, .msg-content h4 { margin: 18px 0 8px; line-height: 1.35; font-weight: 700; }
.msg-content h1 { font-size: 1.45em; } .msg-content h2 { font-size: 1.28em; }
.msg-content h3 { font-size: 1.12em; } .msg-content h4 { font-size: 1.02em; }
.msg-content h1:first-child, .msg-content h2:first-child, .msg-content h3:first-child { margin-top: 2px; }
.msg-content p { margin: 7px 0; }
.msg-content p:first-child { margin-top: 0; } .msg-content p:last-child { margin-bottom: 0; }
.msg-content ul, .msg-content ol { margin: 7px 0; padding-left: 24px; display: flex; flex-direction: column; gap: 4px; }
.msg-content li::marker { color: var(--text-dim); }
.msg-content blockquote {
    border-left: 3px solid var(--accent-pro); margin: 10px 0; padding: 4px 14px; color: var(--text-sec);
    background: var(--bg-card); border-radius: 0 8px 8px 0;
}
.msg-content hr { border: none; border-top: 1px solid var(--border-color); margin: 16px 0; }
.msg-content a { color: var(--accent-casual); text-decoration: none; border-bottom: 1px solid rgba(59,130,246,0.35); }
.msg-content a:hover { border-bottom-color: var(--accent-casual); }
.msg-content strong { font-weight: 700; }
.inline-code {
    background: var(--bg-surface); padding: 2px 6px; border-radius: 5px;
    font-family: "JetBrains Mono", "SF Mono", ui-monospace, monospace; font-size: 0.88em; border: 1px solid var(--border-soft);
}
.md-table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border-color); border-radius: 10px; -webkit-overflow-scrolling: touch; }
.md-table { border-collapse: collapse; width: 100%; font-size: 14px; }
.md-table th { background: var(--bg-card); font-weight: 650; text-align: left; }
.md-table th, .md-table td { padding: 9px 14px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
.md-table tr:last-child td { border-bottom: none; }
.md-table tbody tr:hover { background: var(--bg-card); }

/* ==== 思维链面板 (深度思考) ==== */
.reasoning-panel {
    border: 1px solid var(--border-soft); border-radius: 12px; overflow: hidden; margin-bottom: 4px;
    background: var(--bg-card);
}
.reasoning-head {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; user-select: none;
    font-size: 12.5px; color: var(--text-sec); font-weight: 600; transition: 0.2s;
}
.reasoning-head:hover { color: var(--text-main); }
.reasoning-head .chev { transition: transform 0.25s; margin-left: auto; }
.reasoning-panel.open .chev { transform: rotate(180deg); }
.reasoning-pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-pro); animation: rPulse 1.2s infinite ease-in-out; flex-shrink: 0; }
@keyframes rPulse { 0%,100% { opacity: 0.3; transform: scale(0.8);} 50% { opacity: 1; transform: scale(1.15);} }
.reasoning-pulse.done { animation: none; opacity: 0.85; }
.reasoning-body {
    display: none; padding: 4px 14px 12px; font-size: 13px; line-height: 1.65; color: var(--text-dim);
    border-left: 2px solid var(--border-color); margin: 0 14px 12px; white-space: pre-wrap; word-break: break-word;
    max-height: 320px; overflow-y: auto;
}
.reasoning-panel.open .reasoning-body { display: block; }

/* ==== 流式光标 ==== */
.stream-cursor {
    display: inline-block; width: 8px; height: 17px; background: var(--text-main); border-radius: 2px;
    vertical-align: text-bottom; margin-left: 2px; animation: blink 0.85s steps(2) infinite;
}
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

/* ==== 消息元数据与操作 ==== */
.msg-meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-variant-numeric: tabular-nums; }
.msg-meta .sep { opacity: 0.45; }
.msg-actions { display: flex; gap: 2px; opacity: 0; transition: 0.2s; }
.message-row:hover .msg-actions { opacity: 1; }
@media (hover: none) { .msg-actions { opacity: 0.55; } }
.act-btn {
    background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 5px;
    border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: 0.15s;
}
.act-btn:hover { color: var(--text-main); background: var(--bg-surface); }
.act-btn.danger:hover { color: var(--danger); }

/* ==== 思考等待动画 ==== */
.thinking-indicator {
    display: flex; align-items: center; gap: 4px; background: var(--bg-surface); padding: 10px 16px; border-radius: 20px; border-top-left-radius: 5px; width: fit-content;
}
.thinking-dot { width: 6px; height: 6px; background: var(--text-sec); border-radius: 50%; opacity: 0.4; animation: pulse 1.4s infinite ease-in-out both; }
.thinking-dot:nth-child(2) { animation-delay: 0.2s; }
.thinking-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1.1); opacity: 1; } }

/* ==== 代码卡片 ==== */
.code-card, .artifact-card {
    background: var(--bg-deep); border: 1px solid var(--border-color); border-radius: 12px;
    margin: 12px 0; width: 100%; overflow: hidden; display: flex; flex-direction: column;
}
[data-theme="dark"] .code-card { background: #0d0d0d; }
.code-header, .artifact-header {
    display: flex; justify-content: space-between; align-items: center; padding: 8px 14px;
    background: var(--bg-card); border-bottom: 1px solid var(--border-soft);
}
.code-lang { font-size: 11.5px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; }
.btn-copy {
    background: transparent; border: none; color: var(--text-dim); font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; transition: 0.2s; font-family: inherit; padding: 4px 6px; border-radius: 6px;
}
.btn-copy:hover { color: var(--text-main); background: var(--bg-surface); }
.code-card pre {
    margin: 0; padding: 14px 16px; overflow-x: auto;
    font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.6;
    -webkit-overflow-scrolling: touch;
}
.code-card pre::-webkit-scrollbar { height: 6px; }
.code-card pre::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
code { font-family: "JetBrains Mono", "SF Mono", ui-monospace, monospace; }
.tk-k { color: var(--code-key); } .tk-s { color: var(--code-str); } .tk-n { color: var(--code-num); }
.tk-c { color: var(--code-com); font-style: italic; } .tk-t { color: var(--code-tag); } .tk-a { color: var(--code-attr); }

.artifact-card { background: var(--bg-card); }
.artifact-header { background: transparent; border-bottom: 1px solid var(--border-soft); padding: 11px 14px; }
.artifact-title { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13.5px; color: var(--text-main); }
.artifact-stats { font-size: 11px; color: var(--text-dim); padding: 8px 14px 0; font-variant-numeric: tabular-nums; }
.artifact-btns { display: flex; gap: 8px; padding: 10px 14px 14px; flex-wrap: wrap; }
.btn-mini {
    background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-soft);
    padding: 7px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: 0.2s; font-family: inherit; display: flex; align-items: center; gap: 6px;
}
.btn-mini:hover { border-color: var(--text-dim); transform: translateY(-1px); }
.btn-mini.primary { background: var(--text-main); color: var(--bg-main); border-color: transparent; }
.btn-mini.primary:hover { opacity: 0.88; }

/* ==== 错误卡片 ==== */
.error-card {
    border: 1px solid rgba(239,68,68,0.4); background: rgba(239,68,68,0.07); border-radius: 12px;
    padding: 12px 16px; font-size: 13.5px; color: var(--text-sec); display: flex; flex-direction: column; gap: 10px;
}
.error-card .e-title { color: var(--danger); font-weight: 650; font-size: 13px; display: flex; align-items: center; gap: 7px; }

/* ==== Input Dock ==== */
.input-area-container {
    padding: 0 14px 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg-main) 75%, transparent);
    display: flex; flex-direction: column; align-items: center; z-index: 50; position: relative; flex-shrink: 0; gap: 7px;
}
.input-dock {
    width: 100%; max-width: 800px; background: var(--bg-surface); border-radius: 26px;
    padding: 8px 10px 8px 20px; display: flex; align-items: flex-end; gap: 10px;
    border: 1px solid var(--border-color); box-shadow: 0 4px 18px rgba(0,0,0,0.12); transition: border-color 0.2s;
}
.input-dock:focus-within { border-color: var(--text-dim); }
.input-textarea {
    flex: 1; min-height: 24px; max-height: 160px; border: none; background: transparent;
    font-size: 16px; color: var(--text-main); outline: none; resize: none; line-height: 1.5; padding: 4px 0 8px; font-family: inherit;
}
.input-textarea::placeholder { color: var(--text-dim); }
.btn-send {
    width: 34px; height: 34px; border-radius: 50%; background: var(--text-dim); color: var(--bg-main);
    border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; flex-shrink: 0; margin-bottom: 3px; pointer-events: none; opacity: 0.5;
}
.btn-send.active { background: var(--text-main); opacity: 1; pointer-events: auto; }
.btn-send.active:hover { transform: scale(1.06); }
.btn-send.stop-mode { background: var(--text-main); opacity: 1; pointer-events: auto; }
.dock-hint { font-size: 11px; color: var(--text-dim); user-select: none; }

/* ==== Workspace ==== */
.workspace {
    width: 46%; min-width: 380px; background: var(--bg-main); border-left: 1px solid var(--border-color);
    display: flex; flex-direction: column; transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 100; position: relative; height: 100%;
}
.workspace.hidden { position: absolute; right: 0; transform: translateX(102%); box-shadow: none; }
.workspace-header { height: 54px; padding: 0 14px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 8px; }
.ws-title { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-tabs { display: flex; background: var(--bg-surface); border-radius: 9px; padding: 3px; gap: 2px; }
.ws-tab { border: none; background: transparent; color: var(--text-dim); font-size: 12.5px; font-weight: 600; padding: 6px 13px; border-radius: 7px; cursor: pointer; transition: 0.18s; font-family: inherit; }
.ws-tab.on { background: var(--bg-main); color: var(--text-main); box-shadow: 0 1px 4px rgba(0,0,0,0.18); }
.workspace-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }
#live-preview-frame { width: 100%; height: 100%; border: none; background: #fff; }
#code-viewer {
    width: 100%; height: 100%; background: var(--bg-deep); color: var(--text-main); border: none; padding: 18px;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; line-height: 1.6; resize: none; display: none; outline: none;
}

/* ==== Modal ==== */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 200;
    display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: 0.2s;
}
.modal-overlay.show { display: flex; opacity: 1; }
.modal-card {
    background: var(--bg-card); width: 100%; max-width: 420px; border-radius: 18px; padding: 22px;
    border: 1px solid var(--border-color); box-shadow: 0 18px 50px rgba(0,0,0,0.4); transform: scale(0.96); transition: 0.2s;
    max-height: calc(100vh - 60px); overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.modal-card::-webkit-scrollbar { width: 0; }
.modal-overlay.show .modal-card { transform: scale(1); }
.modal-title { font-size: 19px; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.modal-section-label { font-size: 11px; font-weight: 700; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin: 22px 0 12px; padding-bottom: 7px; border-bottom: 1px solid var(--border-soft); }
.modal-section-label:first-of-type { margin-top: 0; }

.form-group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 7px; }
.form-group label { font-size: 12.5px; color: var(--text-sec); font-weight: 600; display: flex; justify-content: space-between; }
.form-group label .val { color: var(--text-main); font-variant-numeric: tabular-nums; }
.form-input {
    background: transparent; border: 1px solid var(--border-color); border-radius: 9px; padding: 11px 12px;
    color: var(--text-main); font-size: 14.5px; outline: none; transition: 0.2s; font-family: inherit; width: 100%;
}
.form-input:focus { border-color: var(--text-main); }
textarea.form-input { resize: vertical; min-height: 64px; line-height: 1.5; font-size: 13.5px; }
select.form-input { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
input[type="range"].form-input { padding: 0; border: none; accent-color: var(--accent-pro); height: 26px; }
.btn-primary {
    width: 100%; background: var(--text-main); color: var(--bg-main); padding: 12px; border-radius: 10px; border: none; font-size: 14.5px; font-weight: 650; cursor: pointer; transition: 0.2s; font-family: inherit;
}
.btn-primary:hover { opacity: 0.88; }
.btn-ghost { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
.btn-ghost:hover { border-color: var(--text-dim); opacity: 1; }
.btn-danger-ghost { background: transparent; border: 1px solid rgba(239,68,68,0.5); color: var(--danger); }

.avatar-upload-box { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; }
.avatar-preview-lg {
    width: 78px; height: 78px; border-radius: 50%; object-fit: cover; background: var(--bg-surface);
    display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; cursor: pointer; border: 2px dashed var(--border-color); transition: 0.2s; overflow: hidden;
}
.avatar-preview-lg img { width: 100%; height: 100%; object-fit: cover; }
.avatar-preview-lg:hover { opacity: 0.82; }

/* ==== Toast ==== */
.toast {
    position: fixed; top: calc(18px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-80px);
    background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main);
    padding: 10px 20px; border-radius: 99px; font-size: 13.5px; font-weight: 600; z-index: 300;
    box-shadow: 0 8px 28px rgba(0,0,0,0.35); transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1); pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

.mobile-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 85; display: none; opacity: 0; transition: 0.3s; }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

@media(max-width: 768px) {
    .sidebar { position: absolute; left: 0; top: 0; bottom: 0; height: 100%; z-index: 90; transform: translateX(-100%); box-shadow: 10px 0 40px rgba(0,0,0,0.3); }
    .sidebar.open { transform: translateX(0); }
    .mobile-backdrop.show { display: block; opacity: 1; }
    .workspace { position: absolute; inset: 0; width: 100%; min-width: 0; height: 100%; z-index: 110; transform: translateY(100%); border-left: none; }
    .workspace.open { transform: translateY(0); }
    .workspace.hidden { transform: translateY(102%); position: absolute; }
    .msg-bubble { max-width: 94%; }
    .message-row.ai .msg-bubble { max-width: calc(100% - 40px); }
    .dock-hint { display: none; }
    .chat-wrapper { padding: 12px 14px 30px; gap: 22px; }
}
@media(min-width: 769px) { .icon-btn.menu-btn { display: none; } }

<script>
'use strict';

/* =========================================================
   内置出厂 API Key (开箱即用 · 可在系统配置中覆盖)
========================================================= */
const BUILTIN_API_KEY = 'sk-5c3c8fcd08004ef6a9aae3eb0bb616d0';

/* =========================================================
   状态
========================================================= */
let userProfile = { name: "User", avatar: "" };
let sessions = {};
let currentSessionId = '';
let currentMode = 'casual';
let isGenerating = false;
let abortCtrl = null;
let currentArtifactCode = '';
let currentArtifactLang = 'html';
let autoFollow = true; // 智能跟随滚动

/* =========================================================
   模式体系 (极致准确化系统 Prompt)
========================================================= */
const MODES = {
    casual: { label: 'Yomi Link', tag: '', color: 'var(--accent-casual)', desc: '日常对话 · 自然亲切 · 均衡速度' },
    pro:    { label: 'Yomi Link', tag: '+', color: 'var(--accent-pro)',  desc: '深度推理 · 旗舰模型 · 思维链可视化' },
    se:     { label: 'Yomi Link', tag: 'SE', color: 'var(--accent-se)',  desc: '极简高效 · 极限省 Token · 直出答案' }
};

const PROMPTS = {
    casual: `你是 Yomi AI。你自然亲切,但回答绝对追求事实准确与逻辑严密。
回答中可以使用 Markdown(标题、列表、表格、加粗)让信息更清晰。
如果你在回答时需要生成代码,请写出结构完整、无语法漏洞的代码,不要省略关键模块。`,
    pro: `You are Yomi AI (Link+ Pro), an elite reasoning and coding assistant.
Your core directive is absolute, 100% accuracy.
When given a task or complex question:
1. Break down the logic step-by-step before implementing.
2. Rigorously check syntax, edge cases, and all constraints.
3. Write fully completed, bug-free, production-grade code. Never omit sections or use placeholders like '// implement rest here'.
Use rich Markdown (headings, tables, lists) to structure complex answers.
When writing HTML/CSS/JS/SVG, output a complete, standalone block using standard markdown \`\`\`html ... \`\`\`.`,
    se: `你是 Yomi Link SE。极简、高效、准确。要求:极大限度节约Token,直接给出经过严格推理、百分百正确的最终答案或完整代码(渲染UI请用 markdown \`\`\`html ... \`\`\` 包裹)。拒绝任何寒暄、废话、闲聊和免责声明。`
};

const WELCOME_PROMPTS = [
    '帮我写一个粒子动画 HTML 页面',
    '用表格对比三种排序算法',
    '解释一下 Transformer 的注意力机制',
    '写一首关于深夜代码的短诗'
];

/* =========================================================
   初始化 (完全兼容旧版 yomilink_* 存储键,数据无缝继承)
========================================================= */
function initApp() {
    try {
        const savedProfile = localStorage.getItem('yomilink_profile');
        if (savedProfile) userProfile = JSON.parse(savedProfile);
        const savedSessions = localStorage.getItem('yomilink_sessions');
        if (savedSessions) sessions = JSON.parse(savedSessions);
    } catch(e) { console.warn('存档解析异常', e); }

    document.getElementById('api-provider').value = localStorage.getItem('yomilink_api_prov') || 'deepseek';
    document.getElementById('api-base').value  = localStorage.getItem('yomilink_api_base') || 'https://api.deepseek.com/v1';
    document.getElementById('api-key').value   = localStorage.getItem('yomilink_api_key') || BUILTIN_API_KEY;
    document.getElementById('api-model').value = localStorage.getItem('yomilink_api_model') || 'deepseek-chat';
    document.getElementById('api-temp').value  = localStorage.getItem('yomilink_api_temp') || '0.6';
    document.getElementById('temp-val').innerText = document.getElementById('api-temp').value;
    document.getElementById('api-ctx').value   = localStorage.getItem('yomilink_ctx') || '12';
    document.getElementById('ctx-val').innerText = document.getElementById('api-ctx').value;
    document.getElementById('api-stream').value = localStorage.getItem('yomilink_stream') || 'on';
    document.getElementById('custom-sys').value = localStorage.getItem('yomilink_custom_sys') || '';

    const theme = localStorage.getItem('yomilink_theme') || 'dark';
    document.body.setAttribute('data-theme', theme);
    currentMode = localStorage.getItem('yomilink_mode') || 'casual';

    updateProfileUI();
    updateModeUI();
    renderModeMenu();
    renderWelcomeChips();

    const sids = Object.keys(sessions);
    if (sids.length > 0) {
        currentSessionId = sids[sids.length - 1];
        renderSidebarSessions();
        renderActiveHistory();
    } else {
        createNewSession();
    }

    // 智能跟随滚动:用户上滑则暂停自动滚动,贴底恢复
    const scroller = document.getElementById('chat-scroller');
    scroller.addEventListener('scroll', () => {
        autoFollow = (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight) < 90;
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
            document.getElementById('mode-menu').classList.remove('show');
        }
    });
    document.addEventListener('click', e => {
        const menu = document.getElementById('mode-menu');
        if (menu.classList.contains('show') && !e.target.closest('#top-title') && !e.target.closest('#mode-menu')) menu.classList.remove('show');
    });
}

/* =========================================================
   工具
========================================================= */
function encodeBase64(str) { return btoa(unescape(encodeURIComponent(str))); }
function decodeBase64(str) { return decodeURIComponent(escape(atob(str))); }
function escHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function fmtNum(n) { return Number(n).toLocaleString('en-US'); }

let toastTimer = null;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

async function copyText(text, btn) {
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
        } else {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            document.execCommand('copy'); document.body.removeChild(ta);
        }
        if (btn) {
            const o = btn.innerHTML;
            btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10a37f" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> 成功`;
            setTimeout(() => { btn.innerHTML = o; }, 1800);
        } else showToast('已复制到剪贴板');
    } catch(e) { showToast('复制失败'); }
}
function copyFromB64(b64, btn) { copyText(decodeBase64(b64), btn); }

/* =========================================================
   轻量语法高亮引擎 (零依赖)
========================================================= */
const HL_KEYWORDS = 'function|return|const|let|var|if|else|for|while|do|switch|case|break|continue|new|class|extends|super|import|export|from|default|async|await|try|catch|finally|throw|typeof|instanceof|in|of|this|null|undefined|true|false|void|delete|yield|static|get|set|def|elif|lambda|pass|with|as|is|not|and|or|None|True|False|self|print|struct|enum|impl|fn|mut|pub|use|match|int|float|double|char|bool|string|public|private|protected|interface|type|namespace|package';

function highlightCode(code, lang) {
    lang = (lang || '').toLowerCase();
    let s = escHtml(code);
    if (['html', 'xml', 'svg', 'vue'].includes(lang)) {
        // HTML 模式:注释 → 标签 → 属性 → 字符串
        s = s.replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([a-zA-Z][\w-]*)|([a-zA-Z-]+)(=)(&quot;.*?&quot;|'[^']*'|"[^"]*")/g,
            (m, com, open, tag, attr, eq, val) => {
                if (com) return `<span class="tk-c">${com}</span>`;
                if (tag) return `${open}<span class="tk-t">${tag}</span>`;
                if (attr) return `<span class="tk-a">${attr}</span>${eq}<span class="tk-s">${val}</span>`;
                return m;
            });
        return s;
    }
    // 通用模式:注释 → 字符串 → 关键字 → 数字
    const re = new RegExp(
        '(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/|#[^\\n]*)' +
        '|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\'|`(?:[^`\\\\]|\\\\.)*`)' +
        '|\\b(' + HL_KEYWORDS + ')\\b' +
        '|\\b(\\d+\\.?\\d*)\\b', 'g');
    return s.replace(re, (m, com, str, kw, num) => {
        if (com) return `<span class="tk-c">${com}</span>`;
        if (str) return `<span class="tk-s">${str}</span>`;
        if (kw)  return `<span class="tk-k">${kw}</span>`;
        if (num) return `<span class="tk-n">${num}</span>`;
        return m;
    });
}

/* =========================================================
   全量 Markdown 引擎 (块级解析 + 行内解析 + 流式容错)
========================================================= */
function parseInline(s) {
    // 输入已 HTML 转义
    const codes = [];
    s = s.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\x00' + (codes.length - 1) + '\x00'; });
    s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^\w*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\x00(\d+)\x00/g, (m, i) => '<code class="inline-code">' + codes[i] + '</code>');
    return s;
}

function buildCodeCard(lang, code, streaming) {
    lang = (lang || 'code').toLowerCase();
    const b64 = encodeBase64(code);
    const isRenderable = ['html', 'svg'].includes(lang);
    const lines = code.split('\n').length;
    const kb = (new Blob([code]).size / 1024).toFixed(1);

    if (isRenderable && !streaming) {
        return `
        <div class="artifact-card">
            <div class="artifact-header">
                <div class="artifact-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-pro)" stroke-width="2.5"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon></svg>
                    Interactive Component <span style="color:var(--text-dim); font-weight:500; text-transform:uppercase; font-size:11px;">${lang}</span>
                </div>
                <button class="btn-copy" onclick="copyFromB64('${b64}', this)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 复制
                </button>
            </div>
            <div class="artifact-stats">${lines} 行 · ${kb} KB</div>
            <div class="artifact-btns">
                <button class="btn-mini primary" onclick="openArtifact('${b64}', '${lang}')">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> 实时渲染
                </button>
                <button class="btn-mini" onclick="downloadCodeB64('${b64}', '${lang}')">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> 下载
                </button>
            </div>
        </div>`;
    }
    return `
    <div class="code-card">
        <div class="code-header">
            <span class="code-lang">${escHtml(lang)}${streaming ? ' · 生成中…' : ''}</span>
            <button class="btn-copy" onclick="copyFromB64('${b64}', this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 复制
            </button>
        </div>
        <pre><code>${highlightCode(code, lang)}</code></pre>
    </div>`;
}

function parseMarkdown(raw, streaming) {
    if (!raw) return '';
    const blocks = [];
    // 1. 提取闭合代码块
    let text = raw.replace(/```([a-zA-Z0-9+#-]*)[ \t]*\n([\s\S]*?)```/g, (m, lang, code) => {
        blocks.push({ lang, code: code.replace(/\n$/, '') });
        return '\n\x01CB' + (blocks.length - 1) + '\x01\n';
    });
    // 2. 流式容错:未闭合的代码块
    text = text.replace(/```([a-zA-Z0-9+#-]*)[ \t]*\n?([\s\S]*)$/, (m, lang, code) => {
        blocks.push({ lang, code, open: true });
        return '\n\x01CB' + (blocks.length - 1) + '\x01\n';
    });

    text = escHtml(text);
    const lines = text.split('\n');
    const out = [];
    let para = [], listBuf = [], listType = null, quoteBuf = [], i = 0;

    const flushPara = () => { if (para.length) { out.push('<p>' + para.map(parseInline).join('<br>') + '</p>'); para = []; } };
    const flushList = () => { if (listBuf.length) { out.push(`<${listType}>` + listBuf.map(l => '<li>' + parseInline(l) + '</li>').join('') + `</${listType}>`); listBuf = []; listType = null; } };
    const flushQuote = () => { if (quoteBuf.length) { out.push('<blockquote>' + quoteBuf.map(parseInline).join('<br>') + '</blockquote>'); quoteBuf = []; } };
    const flushAll = () => { flushPara(); flushList(); flushQuote(); };

    while (i < lines.length) {
        const line = lines[i];
        const cb = line.match(/^\x01CB(\d+)\x01$/);
        if (cb) {
            flushAll();
            const b = blocks[+cb[1]];
            out.push(buildCodeCard(b.lang, b.code, streaming && b.open));
            i++; continue;
        }
        // 表格检测
        if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
            flushAll();
            const headCells = line.trim().slice(1, -1).split('|').map(c => parseInline(c.trim()));
            i += 2;
            const rows = [];
            while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
                rows.push(lines[i].trim().slice(1, -1).split('|').map(c => parseInline(c.trim())));
                i++;
            }
            out.push('<div class="md-table-wrap"><table class="md-table"><thead><tr>' +
                headCells.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' +
                rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
                '</tbody></table></div>');
            continue;
        }
        const h = line.match(/^(#{1,4})\s+(.*)/);
        if (h) { flushAll(); out.push(`<h${h[1].length}>` + parseInline(h[2]) + `</h${h[1].length}>`); i++; continue; }
        if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) { flushAll(); out.push('<hr>'); i++; continue; }
        const q = line.match(/^&gt;\s?(.*)/);
        if (q) { flushPara(); flushList(); quoteBuf.push(q[1]); i++; continue; }
        const ul = line.match(/^\s*[-*+]\s+(.*)/);
        const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
        if (ul || ol) {
            flushPara(); flushQuote();
            const t = ul ? 'ul' : 'ol';
            if (listType && listType !== t) flushList();
            listType = t;
            listBuf.push((ul || ol)[1]);
            i++; continue;
        }
        if (line.trim() === '') { flushAll(); i++; continue; }
        flushList(); flushQuote();
        para.push(line);
        i++;
    }
    flushAll();
    return out.join('');
}

function openProfileModal() {
    document.getElementById('profile-name-input').value = userProfile.name;
    const preview = document.getElementById('profile-avatar-preview');
    preview.innerHTML = userProfile.avatar ? `<img src="${userProfile.avatar}">` : userProfile.name.charAt(0).toUpperCase();
    document.getElementById('profile-modal').classList.add('show');
}

function handleAvatarUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const maxSize = 200;
            let w = img.width, h = img.height;
            if (w > h) { if (w > maxSize) { h *= maxSize / w; w = maxSize; } }
            else { if (h > maxSize) { w *= maxSize / h; h = maxSize; } }
            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
            userProfile.avatar = canvas.toDataURL('image/jpeg', 0.8);
            openProfileModal();
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

function saveProfile() {
    userProfile.name = document.getElementById('profile-name-input').value || "User";
    localStorage.setItem('yomilink_profile', JSON.stringify(userProfile));
    updateProfileUI();
    renderActiveHistory();
    closeModal('profile-modal');
    showToast('个人资料已保存');
}

function updateProfileUI() {
    document.getElementById('sidebar-name').innerText = userProfile.name;

}

/* =========================================================
   会话管理 (改名 / 搜索 / 删除 / 时间分组)
========================================================= */
function createNewSession() {
    if (isGenerating) stopGeneration();
    const sid = 'sid_' + Date.now();
    sessions[sid] = { title: '新会话', history: [], ts: Date.now() };
    currentSessionId = sid;
    saveSessions(); renderSidebarSessions(); renderActiveHistory();
    toggleWorkspace(false);
    if (window.innerWidth <= 768) toggleSidebar(false);
    document.getElementById('main-input').focus();
}

function saveSessions() {
    try { localStorage.setItem('yomilink_sessions', JSON.stringify(sessions)); }
    catch(e) { showToast('存储空间不足,请导出备份后清理旧会话'); }
}

function renderSidebarSessions() {
    const list = document.getElementById('session-list');
    const kw = (document.getElementById('session-search').value || '').trim().toLowerCase();
    list.innerHTML = '';
    const sids = Object.keys(sessions).reverse();

    const now = Date.now();
    const groups = { today: [], week: [], earlier: [] };
    sids.forEach(sid => {
        const s = sessions[sid];
        if (kw && !s.title.toLowerCase().includes(kw)) return;
        const age = now - (s.ts || 0);
        if (age < 86400000) groups.today.push(sid);
        else if (age < 7 * 86400000) groups.week.push(sid);
        else groups.earlier.push(sid);
    });
    const labels = { today: '今天', week: '七天内', earlier: '更早' };
    ['today', 'week', 'earlier'].forEach(g => {
        if (!groups[g].length) return;
        const lab = document.createElement('div');
        lab.className = 'history-section-label';
        lab.innerText = labels[g];
        list.appendChild(lab);
        groups[g].forEach(sid => list.appendChild(buildSessionItem(sid)));
    });
}

function buildSessionItem(sid) {
    const item = document.createElement('div');
    item.className = `history-item ${sid === currentSessionId ? 'active' : ''}`;
    item.onclick = () => {
        if (isGenerating) stopGeneration();
        currentSessionId = sid;
        renderSidebarSessions(); renderActiveHistory();
        if (window.innerWidth <= 768) toggleSidebar(false);
        toggleWorkspace(false);
    };
    const titleSpan = document.createElement('span');
    titleSpan.className = 'title-text';
    titleSpan.innerText = sessions[sid].title;

    const renameBtn = document.createElement('button');
    renameBtn.className = 'h-act';
    renameBtn.title = '重命名';
    renameBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';
    renameBtn.onclick = (e) => {
        e.stopPropagation();
        const n = prompt('重命名会话', sessions[sid].title);
        if (n && n.trim()) { sessions[sid].title = n.trim().substring(0, 40); saveSessions(); renderSidebarSessions(); }
    };

    const delBtn = document.createElement('button');
    delBtn.className = 'h-act del';
    delBtn.title = '删除';
    delBtn.innerHTML = '✕';
    delBtn.onclick = (e) => delSession(sid, e);

    item.appendChild(titleSpan);
    item.appendChild(renameBtn);
    item.appendChild(delBtn);
    return item;
}

function delSession(sid, e) {
    e.stopPropagation();
    delete sessions[sid];
    const keys = Object.keys(sessions);
    if (keys.length === 0) { createNewSession(); return; }
    if (currentSessionId === sid) currentSessionId = keys[keys.length - 1];
    saveSessions(); renderSidebarSessions(); renderActiveHistory();
}

   消息渲染 (含思维链 / 元数据 / 操作按钮)

function renderWelcomeChips() {

    WELCOME_PROMPTS.forEach(p => {
        const b = document.createElement('button');
        b.className = 'welcome-chip';
        b.innerText = p;
        b.onclick = () => { document.getElementById('main-input').value = p; autoExpand(document.getElementById('main-input')); handleSendOrStop(); };
        box.appendChild(b);
    });
}

function renderActiveHistory() {
    const scroller = document.getElementById('chat-scroller');
    scroller.innerHTML = '';
    const sess = sessions[currentSessionId];
    if (!sess) return;
    const welcome = document.getElementById('welcome-screen');
    if (sess.history.length === 0) { welcome.classList.remove('hidden'); }
    else {
        welcome.classList.add('hidden');
        sess.history.forEach((msg, idx) => renderBubble(msg, idx));
    }
    requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; });

function aiAvatarHTML() {
    return `<div class="msg-avatar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4L12 2z"></path></svg></div>`;
}
function userAvatarHTML() {
    if (userProfile.avatar) return `<img src="${userProfile.avatar}" class="msg-avatar">`;
    return `<div class="msg-avatar">${escHtml(userProfile.name.charAt(0).toUpperCase())}</div>`;
}

function buildReasoningHTML(reasoning, seconds, done, openState) {
    if (!reasoning) return '';
    const head = done
        ? `已深度思考${seconds ? '(用时 ' + seconds + ' 秒)' : ''}`
        : '正在深度思考…';
    return `
    <div class="reasoning-panel ${openState ? 'open' : ''}">
        <div class="reasoning-head" onclick="const p=this.parentElement; p.classList.toggle('open'); p.dataset.userToggled = p.classList.contains('open') ? 'open' : 'closed';">
            <div class="reasoning-pulse ${done ? 'done' : ''}"></div>
            <span>${head}</span>
            <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="reasoning-body">${escHtml(reasoning)}</div>
    </div>`;
}

function buildMetaHTML(meta) {
    if (!meta) return '';
    const parts = [];
    if (meta.model) parts.push(escHtml(meta.model));
    if (meta.tokens) parts.push(fmtNum(meta.tokens) + ' tokens');
    if (meta.ms) parts.push((meta.ms / 1000).toFixed(1) + 's');
    if (meta.tps) parts.push(meta.tps + ' tok/s');
    if (!parts.length) return '';
    return `<div class="msg-meta">${parts.join('<span class="sep">·</span>')}</div>`;
}

function actionIcon(name) {
    const icons = {
        copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
        edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>',
        regen: '<polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>',
        del: '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>'
    };
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`;
}

function buildActionsHTML(role, idx, isLast) {
    let html = `<div class="msg-actions">`;
    html += `<button class="act-btn" title="复制" onclick="copyMsg(${idx})">${actionIcon('copy')}</button>`;
    if (role === 'user') html += `<button class="act-btn" title="编辑并重发" onclick="editMsg(${idx})">${actionIcon('edit')}</button>`;
    if (role === 'assistant' && isLast) html += `<button class="act-btn" title="重新生成" onclick="regenerate()">${actionIcon('regen')}</button>`;
    html += `<button class="act-btn danger" title="删除" onclick="deleteMsg(${idx})">${actionIcon('del')}</button>`;
    html += `</div>`;
    return html;
}

function renderBubble(msg, idx) {
    const scroller = document.getElementById('chat-scroller');
    const row = document.createElement('div');
    const isUser = msg.role === 'user';
    row.className = `message-row ${isUser ? 'user' : 'ai'}`;
    const hist = sessions[currentSessionId].history;
    const isLast = idx === hist.length - 1;

    let inner = '';
    if (isUser) {
        inner = `<div class="msg-content">${escHtml(msg.content)}</div>`;
    } else {
        inner = buildReasoningHTML(msg.reasoning, msg.meta && msg.meta.thinkSec, true, false)
            + `<div class="msg-content">${parseMarkdown(msg.content, false)}</div>`
            + buildMetaHTML(msg.meta);
    }
    inner += buildActionsHTML(msg.role, idx, isLast);

    row.innerHTML = `${isUser ? userAvatarHTML() : aiAvatarHTML()}<div class="msg-bubble">${inner}</div>`;
    scroller.appendChild(row);
}

function copyMsg(idx) {
    const m = sessions[currentSessionId].history[idx];
    if (m) copyText(m.content);
}
function deleteMsg(idx) {
    sessions[currentSessionId].history.splice(idx, 1);
    saveSessions(); renderActiveHistory();
}
function editMsg(idx) {
    const hist = sessions[currentSessionId].history;
    const m = hist[idx];
    if (!m) return;
    document.getElementById('main-input').value = m.content;
    autoExpand(document.getElementById('main-input'));
    hist.splice(idx); // 移除该消息及其后所有内容
    saveSessions(); renderActiveHistory();
    document.getElementById('main-input').focus();
    showToast('已载入编辑,修改后重新发送');
}
function regenerate() {
    if (isGenerating) return;
    const hist = sessions[currentSessionId].history;
    if (hist.length && hist[hist.length - 1].role === 'assistant') hist.pop();
    saveSessions(); renderActiveHistory();
    requestAI();
}

    row.innerHTML = `${aiAvatarHTML()}
        <div class="msg-bubble">
            <div class="thinking-indicator">
                <span style="font-size:13px; color:var(--text-sec); margin-right:4px;">Yomi 正在思考</span>
                <div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div>
            </div>
        </div>`;
    scroller.appendChild(row);
    scrollFollow(true);
}
function removeThinkingIndicator() {
    const el = document.getElementById('thinking-indicator-row');
    if (el) el.remove();
}
function scrollFollow(force) {
    if (!autoFollow && !force) return;
    const scroller = document.getElementById('chat-scroller');
    scroller.scrollTop = scroller.scrollHeight;
}

/* =========================================================
   模型调度 (Link+ 旗舰升阶)
========================================================= */
function getTargetModel(provider, mode) {
    const customConfigured = (document.getElementById('api-model').value || '').trim();
    if (mode === 'pro') {
        if (provider === 'deepseek') return 'deepseek-reasoner';
        if (provider === 'openai') return 'gpt-4o';
    }
    return customConfigured || (provider === 'deepseek' ? 'deepseek-chat' : 'gpt-4o-mini');
}

/* =========================================================
   动态实时环境注入 (时间锚定 + 用户称呼 + 自定义人格)
========================================================= */
function getDynamicSystemPrompt(mode) {
    const now = new Date();
    const timeString = now.toLocaleString('zh-CN', {
        year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        weekday: 'long', hour12: false
    });
    const basePrompt = PROMPTS[mode] || PROMPTS.casual;
    const custom = (document.getElementById('custom-sys').value || '').trim();
    let p = `${basePrompt}\n\n[实时环境信息]\n当前准确系统时间:${timeString}\n请以此时间作为事实基准进行一切时间推导(如日期计算、未来推演、历史定位、时区转换等),确保回复事实百分百无误。`;
    if (userProfile.name && userProfile.name !== 'User') p += `\n对话者称呼:${userProfile.name}`;
    if (custom) p += `\n\n[用户自定义指令]\n${custom}`;
    return p;
}

/* =========================================================
   【内置 AI 预留接口】(BUILT-IN AI INTERFACE PRESET)
   如需运行本地大模型 (Ollama / WebLLM / Electron 内置):
   解除下方注释并替换为本地请求实现,流式与非流式均兼容
   (本地端点需支持 OpenAI 兼容的 /chat/completions 协议)。
========================================================= */
async function callBuiltInAI(payload, apiConfig) {
    /*
    const LOCAL_ENDPOINT = "http://localhost:11434/v1/chat/completions";
    const LOCAL_MODEL = "llama3";
    return fetch(LOCAL_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            model: LOCAL_MODEL,
            messages: payload,
            temperature: apiConfig.temperature,
            stream: apiConfig.stream
        }),
        signal: apiConfig.signal
    });
    */
    throw new Error("检测到内置 AI 接口已被启动,请先在 callBuiltInAI 函数中完成您的本地大模型对接代码。");
}
const USE_BUILTIN_AI = false;

/* =========================================================
   输入区
========================================================= */
const inputEl = document.getElementById('main-input');
const sendBtn = document.getElementById('send-button');

function autoExpand(el) {
    el.style.height = '24px';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    if (!isGenerating) {
        if (el.value.trim().length > 0) sendBtn.classList.add('active');
        else sendBtn.classList.remove('active');
    }
}

inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendOrStop(); }
});

function setSendButtonState(generating) {
    const icon = document.getElementById('send-icon');
    if (generating) {
        sendBtn.classList.add('stop-mode');
        icon.innerHTML = '<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"></rect>';
    } else {
        sendBtn.classList.remove('stop-mode');
        icon.innerHTML = '<line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline>';
        autoExpand(inputEl);
    }
}

function handleSendOrStop() {
    if (isGenerating) { stopGeneration(); return; }
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    autoExpand(inputEl);
    document.getElementById('welcome-screen').classList.add('hidden');

    const sess = sessions[currentSessionId];
    sess.history.push({ role: 'user', content: text });
    if (sess.history.length === 1) sess.title = text.replace(/\s+/g, ' ').substring(0, 18);
    sess.ts = Date.now();

    saveSessions(); renderSidebarSessions(); renderActiveHistory();
    autoFollow = true;
    requestAI();
}

function stopGeneration() {
    if (abortCtrl) abortCtrl.abort();
}

/* =========================================================
   核心:流式 AI 请求引擎 (SSE + 思维链 + 回退)
========================================================= */
async function requestAI() {
    if (isGenerating) return;
    isGenerating = true;
    setSendButtonState(true);

    const base = document.getElementById('api-base').value.replace(/\/+$/, '');
    const key = document.getElementById('api-key').value || BUILTIN_API_KEY;
    const provider = document.getElementById('api-provider').value;
    const useStream = document.getElementById('api-stream').value !== 'off';

    if (!key && !USE_BUILTIN_AI) {
        finalizeAssistant({ content: '⚠️ 未配置 API Key。请打开左侧侧边栏右上角 ⚙ 系统配置进行设置。', meta: null });
        return;
    }

    const activeModel = getTargetModel(provider, currentMode);
    let temp = parseFloat(document.getElementById('api-temp').value);
    if (currentMode === 'pro') temp = Math.min(temp, 0.3);
    if (currentMode === 'se') temp = 0.0;
    const ctxLen = parseInt(document.getElementById('api-ctx').value) || 12;

    const sysMsg = { role: 'system', content: getDynamicSystemPrompt(currentMode) };
    const histPayload = sessions[currentSessionId].history
        .slice(-ctxLen)
        .map(m => ({ role: m.role, content: m.content }));
    const payload = [sysMsg, ...histPayload];

    abortCtrl = new AbortController();
    const t0 = performance.now();
    let answer = '', reasoning = '', usage = null;
    let thinkStart = 0, thinkEnd = 0;

    showThinkingIndicator();

    // 流式渲染节流器
    let liveRow = null, renderQueued = false;
    const ensureLiveRow = () => {
        if (liveRow) return;
        removeThinkingIndicator();
        const scroller = document.getElementById('chat-scroller');
        liveRow = document.createElement('div');
        liveRow.className = 'message-row ai';
        liveRow.innerHTML = `${aiAvatarHTML()}<div class="msg-bubble"><div class="live-slot"></div></div>`;
        scroller.appendChild(liveRow);
    };
    const renderLive = () => {
        renderQueued = false;
        if (!liveRow) return;
        const slot = liveRow.querySelector('.live-slot');
        const thinking = reasoning && !answer;
        const secs = thinkEnd ? ((thinkEnd - thinkStart) / 1000).toFixed(1) : (thinkStart ? ((performance.now() - thinkStart) / 1000).toFixed(1) : 0);
        let html = '';
        if (reasoning) {
            // 思考阶段自动展开,回答开始后自动折叠
            const panel = slot.querySelector('.reasoning-panel');
            const userToggled = panel ? panel.dataset.userToggled : '';
            const open = userToggled ? (userToggled === 'open') : thinking;
            html += buildReasoningHTML(reasoning, secs, !thinking, open);
        }
        if (answer) {
            html += `<div class="msg-content">${parseMarkdown(answer, true)}<span class="stream-cursor"></span></div>`;
        } else if (!reasoning) {
            html += `<div class="msg-content"><span class="stream-cursor"></span></div>`;
        }
        // 保持思维链展开滚动位置
        const oldBody = slot.querySelector('.reasoning-body');
        const oldScroll = oldBody ? oldBody.scrollTop + oldBody.clientHeight >= oldBody.scrollHeight - 20 : true;
        const prevToggled = (slot.querySelector('.reasoning-panel') || {}).dataset ? slot.querySelector('.reasoning-panel').dataset.userToggled : '';
        slot.innerHTML = html;
        const newPanel = slot.querySelector('.reasoning-panel');
        if (newPanel && prevToggled) newPanel.dataset.userToggled = prevToggled;
        const newBody = slot.querySelector('.reasoning-body');
        if (newBody && thinking && oldScroll) newBody.scrollTop = newBody.scrollHeight;
        scrollFollow();
    };
    const scheduleRender = () => {
        if (renderQueued) return;
        renderQueued = true;
        setTimeout(renderLive, 70);
    };

    try {
        const body = {
            model: activeModel,
            messages: payload,
            temperature: temp,
            stream: useStream
        };
        if (useStream) body.stream_options = { include_usage: true };

        let res;
        if (USE_BUILTIN_AI) {
            res = await callBuiltInAI(payload, { temperature: temp, stream: useStream, signal: abortCtrl.signal });
        } else {
            res = await fetch(`${base}/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                body: JSON.stringify(body),
                signal: abortCtrl.signal
            });
        }

        if (!res.ok) {
            let detail = `HTTP ${res.status}`;
            try { const j = await res.json(); if (j.error && j.error.message) detail += ` — ${j.error.message}`; } catch(e) {}
            throw new Error(detail);
        }

        if (useStream && res.body) {
            // ===== SSE 流式解析 =====
            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buf = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                const segs = buf.split('\n');
                buf = segs.pop();
                for (const seg of segs) {
                    const line = seg.trim();
                    if (!line.startsWith('data:')) continue;
                    const dataStr = line.slice(5).trim();
                    if (dataStr === '[DONE]') continue;
                    try {
                        const j = JSON.parse(dataStr);
                        if (j.usage) usage = j.usage;
                        const d = (j.choices && j.choices[0] && j.choices[0].delta) || {};
                        if (d.reasoning_content) {
                            if (!thinkStart) thinkStart = performance.now();
                            reasoning += d.reasoning_content;
                            ensureLiveRow(); scheduleRender();
                        }
                        if (d.content) {
                            if (thinkStart && !thinkEnd) thinkEnd = performance.now();
                            answer += d.content;
                            ensureLiveRow(); scheduleRender();
                        }
                    } catch(e) { /* 跳过不完整 JSON 帧 */ }
                }
            }
        } else {
            // ===== 非流式回退 =====
            const data = await res.json();
            const msg = data.choices[0].message;
            answer = msg.content || '';
            reasoning = msg.reasoning_content || '';
            usage = data.usage || null;
        }

        if (thinkStart && !thinkEnd) thinkEnd = performance.now();
        const ms = performance.now() - t0;
        const tokens = usage ? (usage.completion_tokens || usage.total_tokens) : Math.round((answer.length + reasoning.length) / 3.2);
        const meta = {
            model: activeModel,
            ms: Math.round(ms),
            tokens: tokens,
            tps: ms > 300 ? Math.round(tokens / (ms / 1000)) : null,
            thinkSec: thinkStart ? ((thinkEnd - thinkStart) / 1000).toFixed(1) : null
        };
        finalizeAssistant({ content: answer || '(空回复)', reasoning: reasoning || undefined, meta }, liveRow);

    } catch (e) {
        removeThinkingIndicator();
        if (e.name === 'AbortError') {
            // 中止:保留已生成的部分
            if (answer || reasoning) {
                const ms = performance.now() - t0;
                finalizeAssistant({
                    content: answer + '\n\n> *(已手动停止生成)*',
                    reasoning: reasoning || undefined,
                    meta: { model: activeModel, ms: Math.round(ms), thinkSec: thinkStart ? (((thinkEnd || performance.now()) - thinkStart) / 1000).toFixed(1) : null }
                }, liveRow);
            } else {
                if (liveRow) liveRow.remove();
                isGenerating = false; setSendButtonState(false);
            }
            return;
        }
        renderErrorBubble(e.message, liveRow);
    }
}

function finalizeAssistant(msgObj, liveRow) {
    removeThinkingIndicator();
    if (liveRow) liveRow.remove();
    isGenerating = false;
    abortCtrl = null;
    setSendButtonState(false);
    const sess = sessions[currentSessionId];
    if (!sess) return;
    sess.history.push({ role: 'assistant', content: msgObj.content, reasoning: msgObj.reasoning, meta: msgObj.meta });
    sess.ts = Date.now();
    saveSessions();
    renderActiveHistory();
}

function renderErrorBubble(msg, liveRow) {
    if (liveRow) liveRow.remove();
    isGenerating = false;
    abortCtrl = null;
    setSendButtonState(false);
    const scroller = document.getElementById('chat-scroller');
    const row = document.createElement('div');
    row.className = 'message-row ai';
    row.innerHTML = `${aiAvatarHTML()}
        <div class="msg-bubble">
            <div class="error-card">
                <div class="e-title">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    连接异常
                </div>
                <div>${escHtml(msg)}</div>
                <button class="btn-mini" style="align-self:flex-start;" onclick="this.closest('.message-row').remove(); requestAI();">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg> 重试
                </button>
            </div>
        </div>`;
    scroller.appendChild(row);
    scrollFollow(true);
}

/* =========================================================
   Workspace (实时渲染 / 新标签页 / 下载)
========================================================= */
function openArtifact(b64, lang) {
    currentArtifactCode = decodeBase64(b64);
    currentArtifactLang = lang || 'html';
    document.getElementById('code-viewer').value = currentArtifactCode;
    document.getElementById('ws-title').innerText = 'Live Preview · ' + currentArtifactLang.toUpperCase();
    toggleWorkspace(true);
    switchWsView('preview');
}

function toggleWorkspace(show) {
    const ws = document.getElementById('workspace');
    if (show) { ws.classList.remove('hidden'); ws.classList.add('open'); }
    else { ws.classList.add('hidden'); ws.classList.remove('open'); }
}

function wrapArtifact(code, lang) {
    if (lang === 'svg' && !/^\s*<!DOCTYPE|<html/i.test(code)) {
        return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#fff;}</style></head><body>${code}</body></html>`;
    }
    return code;
}

function switchWsView(type) {
    const prev = document.getElementById('live-preview-frame');
    const code = document.getElementById('code-viewer');
    const bPrev = document.getElementById('ws-btn-preview');
    const bCode = document.getElementById('ws-btn-code');
    if (type === 'preview') {
        prev.style.display = 'block'; code.style.display = 'none';
        bPrev.classList.add('on'); bCode.classList.remove('on');
        prev.srcdoc = wrapArtifact(currentArtifactCode, currentArtifactLang);
    } else {
        prev.style.display = 'none'; code.style.display = 'block';
        bPrev.classList.remove('on'); bCode.classList.add('on');
    }
}

function openArtifactNewTab() {
    if (!currentArtifactCode) return;
    const blob = new Blob([wrapArtifact(currentArtifactCode, currentArtifactLang)], { type: 'text/html;charset=utf-8' });
    window.open(URL.createObjectURL(blob), '_blank');
}

function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function downloadArtifact() {
    if (!currentArtifactCode) return;
    downloadBlob(currentArtifactCode, 'yomi-artifact-' + Date.now() + '.' + (currentArtifactLang === 'svg' ? 'svg' : 'html'), 'text/html;charset=utf-8');
    showToast('已开始下载');
}
function downloadCodeB64(b64, lang) {
    const ext = { html: 'html', svg: 'svg', javascript: 'js', js: 'js', css: 'css', python: 'py', json: 'json' }[lang] || 'txt';
    downloadBlob(decodeBase64(b64), 'yomi-code-' + Date.now() + '.' + ext, 'text/plain;charset=utf-8');
    showToast('已开始下载');
}

/* =========================================================
   模式切换菜单
========================================================= */
function renderModeMenu() {
    const menu = document.getElementById('mode-menu');
    menu.innerHTML = '';
    Object.keys(MODES).forEach(key => {
        const m = MODES[key];
        const opt = document.createElement('div');
        opt.className = `mode-option ${key === currentMode ? 'selected' : ''}`;
        opt.onclick = () => { currentMode = key; localStorage.setItem('yomilink_mode', key); updateModeUI(); renderModeMenu(); document.getElementById('mode-menu').classList.remove('show'); };
        opt.innerHTML = `
            <div class="mode-dot" style="background:${m.color};"></div>
            <div class="mode-info">
                <div class="mode-name">${m.label}${m.tag ? ` <span style="color:${m.color};">${m.tag}</span>` : ''}</div>
                <div class="mode-desc">${m.desc}</div>
            </div>
            <svg class="mode-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        menu.appendChild(opt);
    });
}
function toggleModeMenu() { document.getElementById('mode-menu').classList.toggle('show'); }
function updateModeUI() {
    const title = document.getElementById('top-title');
    const m = MODES[currentMode];
    title.innerHTML = `${m.label}${m.tag ? `<span style="color:${m.color};font-weight:800;">${m.tag}</span>` : ''} <span style="font-size:12px;color:var(--text-sec);">▾</span>`;
}

/* =========================================================
   主题 / 设置 / 备份
========================================================= */
function toggleTheme() {
    const cur = document.body.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    localStorage.setItem('yomilink_theme', next);
}

function toggleApiKeyVisibility() {
    const input = document.getElementById('api-key');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
    } else {
        input.type = 'password';
        icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    }
}

function openSettingsModal() { document.getElementById('settings-modal').classList.add('show'); if (window.innerWidth <= 768) toggleSidebar(false); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function presetApi() {
    const prov = document.getElementById('api-provider').value;
    if (prov === 'deepseek') { document.getElementById('api-base').value = 'https://api.deepseek.com/v1'; document.getElementById('api-model').value = 'deepseek-chat'; }
    else if (prov === 'openai') { document.getElementById('api-base').value = 'https://api.openai.com/v1'; document.getElementById('api-model').value = 'gpt-4o-mini'; }
    else { document.getElementById('api-base').value = ''; document.getElementById('api-model').value = ''; }
}

function saveSettings() {
    localStorage.setItem('yomilink_api_prov', document.getElementById('api-provider').value);
    localStorage.setItem('yomilink_api_base', document.getElementById('api-base').value);
    localStorage.setItem('yomilink_api_key', document.getElementById('api-key').value);
    localStorage.setItem('yomilink_api_model', document.getElementById('api-model').value);
    localStorage.setItem('yomilink_api_temp', document.getElementById('api-temp').value);
    localStorage.setItem('yomilink_ctx', document.getElementById('api-ctx').value);
    localStorage.setItem('yomilink_stream', document.getElementById('api-stream').value);
    localStorage.setItem('yomilink_custom_sys', document.getElementById('custom-sys').value);
    closeModal('settings-modal');
    showToast('配置已保存');
}

function exportAllData() {
    const dump = {};
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('yomilink_') && k !== 'yomilink_api_key') dump[k] = localStorage.getItem(k);
    }
    const date = new Date().toISOString().slice(0, 10);
    downloadBlob(JSON.stringify({ app: 'YomiLink', version: 2, exportedAt: Date.now(), data: dump }, null, 2),
        `yomilink-backup-${date}.json`, 'application/json');
    showToast('备份已导出 (不含 API Key)');
}

function importAllData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        try {
            const j = JSON.parse(ev.target.result);
            const data = j.data || j;
            let n = 0;
            Object.keys(data).forEach(k => {
                if (k.startsWith('yomilink_')) { localStorage.setItem(k, data[k]); n++; }
            });
            showToast(`已导入 ${n} 项数据,即将刷新…`);
            setTimeout(() => location.reload(), 900);
        } catch(err) { showToast('备份文件解析失败'); }
    };
    reader.readAsText(file);
    e.target.value = '';
}

function hardReset() {
    if (confirm("确定清除所有本地记忆及配置数据?此操作不可撤销,建议先导出备份。")) {
        Object.keys(localStorage).filter(k => k.startsWith('yomilink_')).forEach(k => localStorage.removeItem(k));
        location.reload();
    }
}

function toggleSidebar(show) {
    const sb = document.getElementById('sidebar');
    const bd = document.getElementById('mobile-backdrop');
    if (show) { sb.classList.add('open'); bd.classList.add('show'); }
    else { sb.classList.remove('open'); bd.classList.remove('show'); }
}

window.onload = initApp;
